name: Metrics
on:
  # Tries to update every day at midnight
  schedule: [{cron: "0 0 * * *"}]
  # Allows manual run
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shahdshares
          template: classic
          base: header, activity, community, repositories
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 28
